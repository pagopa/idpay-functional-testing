name: test-run

permissions:
  id-token: write
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allows manual run
    inputs:
      feature:
        type: choice
        description: Run functional tests by tag
        required: false
        default: bonus_elettrodomestici
        options:
          - all
          - bonus_elettrodomestici
          - onboarding
          - transaction
          - cancellation
          - readmission
          - refunds
          - unsubscribe
          - family
          - bar_code
          - idpay_code
          - ranking

      environment:
        description: Environment
        required: false
        default: dev
        type: choice
        options:
          - dev
          - uat

jobs:
  run-bdd-feature-tests:
    runs-on: [ self-hosted-job, "${{ inputs.environment || 'dev' }}" ]
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      PARI_TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      FEATURE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.feature || 'bonus_elettrodomestici' }}

    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 #v5.4.0

      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Azure Login
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a #v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        uses: azure/CLI@089eac9d8cc39f5d003e94f8b65efc51076c9cbd #v2.1.0
        with:
          inlineScript: |
            echo "🔐 Fetching secret from Key Vault..."
            
            mkdir -p $GITHUB_WORKSPACE/secrets
            
            az keyvault secret show \
              --name "${{ secrets.SECRET_NAME }}" \
              --vault-name "${{ secrets.KEYVAULT_NAME }}" \
              --query 'value' -o json | jq -r '.' > $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json
            
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "::error::Failed to fetch secret from Key Vault"
              exit 1
            fi
            
            if [ ! -s $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json ]; then
              echo "::error::Secret file is empty"
              exit 1
            fi
            
            echo "📦 Validating JSON..."
            
            if ! jq empty $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json 2>/dev/null; then
              echo "::error::Invalid JSON format in secrets file"
              echo "File size: $(wc -c < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json) bytes"
              echo "Line count: $(wc -l < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json)"
              exit 1
            fi
            
            echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"
            
            echo "✅ Secret ready"

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 #v5.2.0
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          python3 -m pipenv sync
          pipenv install allure-behave

      - name: Display Python and Pip versions
        run: |
          python3 --version
          pip3 --version
          pipenv --version
          pipenv run pip show allure-behave

      - name: Run tests with Behave
        run: |
          echo "Running env=$PARI_TARGET_ENV tag=$FEATURE_TAG"
          if [ "$FEATURE_TAG" = "all" ]; then
            python3 -m pipenv run behave --junit --junit-directory "tests/reports/behave" --format allure_behave.formatter:AllureFormatter -o allure-results
          else
            python3 -m pipenv run behave --junit --junit-directory "tests/reports/behave" --tags "$FEATURE_TAG" --format allure_behave.formatter:AllureFormatter -o allure-results
          fi
        continue-on-error: true

      - name: Sanitize allure results
        if: always()
        run: |
          python util/sanitize-allure-results.py allure-results

      - name: Save BDD test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        id: upload_bdd_test_results
        with:
          name: allure-results-bdd
          path: allure-results

      - name: Load test report history
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@53ebb757a2097edc77c53ecef4d454fc2f2f774c
        if: always()
        continue-on-error: true
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          subfolder: bdd
          keep_reports: 30

      - name: Sanitize allure history
        if: always()
        run: |
          python util/sanitize-allure-results.py allure-history

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        if: always()
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
