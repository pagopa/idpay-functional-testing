name: test-run

permissions:
  id-token: write
  contents: write

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: Behave tag to filter
        required: false
        default: all
        options:
          - all
          - bonus_elettrodomestici
          - bonus_decoder
          - rdb
          - portale_enti
          - merchant_portal
          - report_csv
          - reward_batch
          - reward_batch_counter
          - onboarding
          - transaction
          - bar_code

      initiative:
        type: choice
        description: Initiative to run
        required: false
        default: all
        options:
          - all
          - bonus_elettrodomestici
          - bonus_decoder

      environment:
        description: Environment
        required: false
        default: uat
        type: choice
        options:
          - uat

      test_type:
        description: Test type to run
        required: false
        default: bdd
        type: choice
        options:
          - bdd
          - ui
          - all

      ui_target:
        description: UI target to test
        required: false
        default: welfare_enti
        type: choice
        options:
          - welfare_enti
          - welfare_esercenti
          - rdb
          - pari_utente

      reward_batch_cleanup:
        description: Cleanup environment after test run
        required: true
        type: boolean
        default: true

jobs:
  run-bdd:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'bdd' || inputs.test_type == 'all' }}
    uses: ./.github/workflows/test-run-bdd.yaml
    with:
      target_env: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
      feature_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.feature || 'all' }}
      initiative: ${{ github.event_name == 'workflow_dispatch' && inputs.initiative || 'all' }}
      reward_batch_cleanup: ${{ github.event_name != 'workflow_dispatch' || inputs.reward_batch_cleanup }}
    secrets: inherit

  run-ui:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_type == 'ui' || inputs.test_type == 'all' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/test-run-ui.yaml
    with:
      target_env: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }}
      ui_target: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_target || 'all' }}
    secrets: inherit