name: test-run-functional-test

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      target_env:
        type: string
        required: true
        description: 'Target environment (dev or uat)'

jobs:
  run-functional-tests:
    runs-on: [ self-hosted-job, "${{ inputs.target_env }}" ]
    environment: ${{ inputs.target_env }}
    env:
      TARGET_ENV: ${{ inputs.target_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Azure Login
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a #v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        run: |
          echo "🔐 Fetching secret from Key Vault..."

          mkdir -p $GITHUB_WORKSPACE/secrets

          az keyvault secret show \
            --name "${{ secrets.SECRET_NAME }}" \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --query 'value' -o json | jq -r '.' > $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Failed to fetch secret from Key Vault"
            exit 1
          fi

          if [ ! -s $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json ]; then
            echo "::error::Secret file is empty"
            exit 1
          fi

          echo "📦 Validating JSON..."

          if ! jq empty $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json 2>/dev/null; then
            echo "::error::Invalid JSON format in secrets file"
            echo "File size: $(wc -c < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json) bytes"
            echo "Line count: $(wc -l < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json)"
            exit 1
          fi

          echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"

          echo "✅ Secret ready"

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 #v5.2.0
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          python3 -m pipenv sync
          python3 -m pipenv install allure-pytest

      - name: Display Python and Pip versions
        run: |
          python3 --version
          pip3 --version
          pipenv --version

      - name: Run tests with Pytest
        env:
          ENV_FOR_DYNACONF: ${{ env.TARGET_ENV }}
        run: |
          echo "Running pytest on env=$TARGET_ENV"
          python3 -m pipenv run pytest tests/ --alluredir=allure-results-pytest --junitxml=tests/reports/pytest/junit.xml -vv || true

      - name: Sanitize pytest allure results
        if: always()
        run: |
          python3 util/sanitize-allure-results.py allure-results-pytest

      - name: Save pytest test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-results-pytest
          path: allure-results-pytest

  publish-functional-test-report:
    needs: run-functional-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Download pytest test results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: allure-results-pytest
          path: allure-results-pytest
      
      - name: Add Allure executor metadata
        if: always()
        run: |
          cat > allure-results-pytest/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Functional Report #${{ github.run_number }}",
            "reportUrl": "https://pagopa.github.io/${{ github.event.repository.name }}/functional-tests"
          }
          EOF

      - name: Load test report history
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Install Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline --no-fund --no-audit

      - name: Build functional test report
        if: always()
        run: |
          if [ -d gh-pages/functional-tests/last-history ]; then
            mkdir -p allure-results-pytest/history
            cp -R gh-pages/functional-tests/last-history/. allure-results-pytest/history/
          fi

          allure generate allure-results-pytest --clean -o allure-report-pytest

          mkdir -p allure-report-pytest/last-history
          if [ -d allure-report-pytest/history ]; then
            cp -R allure-report-pytest/history/. allure-report-pytest/last-history/
          fi

      - name: Sanitize functional test report
        if: always()
        run: |
          python3 util/sanitize-allure-results.py allure-report-pytest

      - name: Publish functional test report
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e #v4.0.0
        if: always()
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: allure-report-pytest
          destination_dir: functional-tests
          keep_files: true
