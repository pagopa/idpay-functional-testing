name: test-run-ui

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      target_env:
        type: string
        required: true
        description: 'Target environment for UI tests (dev or uat)'
      ui_target:
        type: string
        required: true
        description: 'UI target to test (welfare_enti, welfare_esercenti, rdb, pari_utente)'

jobs:
  run-ui-tests:
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}

    env:
      PARI_TARGET_ENV: ${{ inputs.target_env }}
      UI_TARGET: ${{ inputs.ui_target }}
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      UI_LOGIN_PATH: ${{ vars.UI_LOGIN_PATH }}
      UI_POST_LOGIN_PATH: ${{ vars.UI_POST_LOGIN_PATH }}
      UI_POST_LOGIN_URL: ${{ vars.UI_POST_LOGIN_URL }}
      USER_USERNAME: ${{ secrets.USER_USERNAME }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
      SECRET_NAME: ${{ secrets.SECRET_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 #v4.0.2
        with:
          node-version: 20
          cache: npm

      - name: Azure Login
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a #v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        run: |
          echo "Fetching secret from Key Vault..."

          mkdir -p "$GITHUB_WORKSPACE/secrets"

          az keyvault secret show \
            --name "$SECRET_NAME" \
            --vault-name "$KEYVAULT_NAME" \
            --query 'value' -o json | jq -r '.' > "$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json"

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Failed to fetch secret from Key Vault"
            exit 1
          fi

          if [ ! -s "$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" ]; then
            echo "::error::Secret file is empty"
            exit 1
          fi

          if ! jq empty "$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" 2>/dev/null; then
            echo "::error::Invalid JSON format in secrets file"
            exit 1
          fi

          echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Resolve portal-specific UI configuration
        run: |
          TARGET=$(echo "$UI_TARGET" | tr '[:upper:]' '[:lower:]')

          KV_UI_BASE_URL=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].base_url // empty' "$PARI_SECRET_PATH")
          KV_UI_LOGIN_PATH=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].login_path // empty' "$PARI_SECRET_PATH")
          KV_UI_POST_LOGIN_PATH=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].post_login_path // empty' "$PARI_SECRET_PATH")
          KV_UI_POST_LOGIN_URL=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].post_login_url // empty' "$PARI_SECRET_PATH")
          KV_USER_USERNAME=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].username // empty' "$PARI_SECRET_PATH")
          KV_USER_PASSWORD=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].password // empty' "$PARI_SECRET_PATH")
          KV_LOGIN_BUTTON_TESTID=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].login_button_testid // empty' "$PARI_SECRET_PATH")
          KV_LOGIN_BUTTON_NAME=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].login_button_name // empty' "$PARI_SECRET_PATH")
          KV_SPID_BUTTON_TESTID=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].spid_button_testid // empty' "$PARI_SECRET_PATH")
          KV_IDP_BUTTON_TESTID=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].idp_button_testid // empty' "$PARI_SECRET_PATH")
          KV_USERNAME_LABEL=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].username_label // empty' "$PARI_SECRET_PATH")
          KV_PASSWORD_LABEL=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].password_label // empty' "$PARI_SECRET_PATH")
          KV_SUBMIT_BUTTON_NAME=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].submit_button_name // empty' "$PARI_SECRET_PATH")
          KV_CONSENT_BUTTON_NAME=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].consent_button_name // empty' "$PARI_SECRET_PATH")
          KV_GENERIC_FALLBACKS=$(jq -r --arg env "$PARI_TARGET_ENV" --arg target "$TARGET" '.[$env].ui_targets[$target].enable_generic_login_fallbacks // empty' "$PARI_SECRET_PATH")

          RESOLVED_UI_BASE_URL="$UI_BASE_URL"
          RESOLVED_UI_LOGIN_PATH="$UI_LOGIN_PATH"
          RESOLVED_UI_POST_LOGIN_PATH="$UI_POST_LOGIN_PATH"
          RESOLVED_UI_POST_LOGIN_URL="$UI_POST_LOGIN_URL"
          RESOLVED_USER_USERNAME="$USER_USERNAME"
          RESOLVED_USER_PASSWORD="$USER_PASSWORD"

          case "$TARGET" in
            welfare_enti|welfare_esercenti|rdb|pari_utente) ;;
            *)
              echo "::error::Unsupported ui_target '$UI_TARGET'. Allowed values: welfare_enti, welfare_esercenti, rdb, pari_utente"
              exit 1
              ;;
          esac

          RESOLVED_UI_BASE_URL="${KV_UI_BASE_URL:-$RESOLVED_UI_BASE_URL}"
          RESOLVED_UI_LOGIN_PATH="${KV_UI_LOGIN_PATH:-$RESOLVED_UI_LOGIN_PATH}"
          RESOLVED_UI_POST_LOGIN_PATH="${KV_UI_POST_LOGIN_PATH:-$RESOLVED_UI_POST_LOGIN_PATH}"
          RESOLVED_UI_POST_LOGIN_URL="${KV_UI_POST_LOGIN_URL:-$RESOLVED_UI_POST_LOGIN_URL}"
          RESOLVED_USER_USERNAME="${KV_USER_USERNAME:-$RESOLVED_USER_USERNAME}"
          RESOLVED_USER_PASSWORD="${KV_USER_PASSWORD:-$RESOLVED_USER_PASSWORD}"

          echo "UI_BASE_URL=$RESOLVED_UI_BASE_URL" >> "$GITHUB_ENV"
          echo "UI_LOGIN_PATH=$RESOLVED_UI_LOGIN_PATH" >> "$GITHUB_ENV"
          echo "UI_POST_LOGIN_PATH=$RESOLVED_UI_POST_LOGIN_PATH" >> "$GITHUB_ENV"
          echo "UI_POST_LOGIN_URL=$RESOLVED_UI_POST_LOGIN_URL" >> "$GITHUB_ENV"
          echo "USER_USERNAME=$RESOLVED_USER_USERNAME" >> "$GITHUB_ENV"
          echo "USER_PASSWORD=$RESOLVED_USER_PASSWORD" >> "$GITHUB_ENV"

          RESOLVED_LOGIN_BUTTON_TESTID="${KV_LOGIN_BUTTON_TESTID:-$UI_LOGIN_BUTTON_TESTID}"
          RESOLVED_LOGIN_BUTTON_NAME="${KV_LOGIN_BUTTON_NAME:-$UI_LOGIN_BUTTON_NAME}"
          RESOLVED_SPID_BUTTON_TESTID="${KV_SPID_BUTTON_TESTID:-$UI_SPID_BUTTON_TESTID}"
          RESOLVED_IDP_BUTTON_TESTID="${KV_IDP_BUTTON_TESTID:-$UI_IDP_BUTTON_TESTID}"
          RESOLVED_USERNAME_LABEL="${KV_USERNAME_LABEL:-$UI_USERNAME_LABEL}"
          RESOLVED_PASSWORD_LABEL="${KV_PASSWORD_LABEL:-$UI_PASSWORD_LABEL}"
          RESOLVED_SUBMIT_BUTTON_NAME="${KV_SUBMIT_BUTTON_NAME:-$UI_SUBMIT_BUTTON_NAME}"
          RESOLVED_CONSENT_BUTTON_NAME="${KV_CONSENT_BUTTON_NAME:-$UI_CONSENT_BUTTON_NAME}"
          RESOLVED_GENERIC_FALLBACKS="${KV_GENERIC_FALLBACKS:-$UI_ENABLE_GENERIC_LOGIN_FALLBACKS}"

          [ -n "$RESOLVED_LOGIN_BUTTON_TESTID" ] && echo "UI_LOGIN_BUTTON_TESTID=$RESOLVED_LOGIN_BUTTON_TESTID" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_LOGIN_BUTTON_NAME" ] && echo "UI_LOGIN_BUTTON_NAME=$RESOLVED_LOGIN_BUTTON_NAME" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_SPID_BUTTON_TESTID" ] && echo "UI_SPID_BUTTON_TESTID=$RESOLVED_SPID_BUTTON_TESTID" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_IDP_BUTTON_TESTID" ] && echo "UI_IDP_BUTTON_TESTID=$RESOLVED_IDP_BUTTON_TESTID" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_USERNAME_LABEL" ] && echo "UI_USERNAME_LABEL=$RESOLVED_USERNAME_LABEL" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_PASSWORD_LABEL" ] && echo "UI_PASSWORD_LABEL=$RESOLVED_PASSWORD_LABEL" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_SUBMIT_BUTTON_NAME" ] && echo "UI_SUBMIT_BUTTON_NAME=$RESOLVED_SUBMIT_BUTTON_NAME" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_CONSENT_BUTTON_NAME" ] && echo "UI_CONSENT_BUTTON_NAME=$RESOLVED_CONSENT_BUTTON_NAME" >> "$GITHUB_ENV"
          [ -n "$RESOLVED_GENERIC_FALLBACKS" ] && echo "UI_ENABLE_GENERIC_LOGIN_FALLBACKS=$RESOLVED_GENERIC_FALLBACKS" >> "$GITHUB_ENV"

          if [ -z "$RESOLVED_UI_BASE_URL" ]; then
            echo "::warning::UI_BASE_URL is empty after portal resolution. UI authenticated tests may be skipped."
          fi

          if [ -z "$RESOLVED_USER_USERNAME" ] || [ -z "$RESOLVED_USER_PASSWORD" ]; then
            echo "::warning::Credentials are empty for target '$TARGET'. UI authenticated tests may be skipped."
          fi

      - name: Run UI tests
        run: npm run ui:test -- --project=chromium

      - name: Upload UI results
        id: upload_ui_results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ui-test-results
          path: |
            ./test-results
            ./playwright-report
          if-no-files-found: ignore

  pr-ui-report-preview:
    needs: run-ui-tests
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve UI artifact id
        id: artifact_lookup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const result = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            const artifact = result.data.artifacts.find((a) => a.name === 'ui-test-results' && !a.expired);

            core.setOutput('exists', artifact ? 'true' : 'false');
            core.setOutput('artifact_id', artifact ? String(artifact.id) : '');

      - name: Comment PR with report preview link
        if: ${{ steps.artifact_lookup.outputs.exists == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const artifactId = '${{ steps.artifact_lookup.outputs.artifact_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifactId}`;

            const body = [
              '### UI Report Preview',
              '',
              `- Run: ${runUrl}`,
              `- Playwright report artifact: ${artifactUrl}`,
              '',
              'Download the artifact and open `playwright-report/index.html` locally.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

  publish-ui-report:
    needs: run-ui-tests
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Download UI report artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: ui-test-results
          path: ./ui-artifacts

      - name: Check if Playwright report exists
        id: check_report
        if: always()
        run: |
          if [ -d "./ui-artifacts/playwright-report" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Redact sensitive information from Playwright report
        if: always() && steps.check_report.outputs.exists == 'true'
        run: bash ./redact-passwords.sh ./ui-artifacts/playwright-report

      - name: Generate Playwright report bundle
        if: always() && steps.check_report.outputs.exists == 'true'
        run: |
          mkdir -p ./public/reports/${{ github.run_id }}/
          cp -r -- ./ui-artifacts/playwright-report/* ./public/reports/${{ github.run_id }}/
          echo "Playwright report generated at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/"

      - name: Generate index page with report links
        if: always() && steps.check_report.outputs.exists == 'true'
        continue-on-error: true
        run: |
          git fetch origin gh-pages:gh-pages || true
          git worktree add -f ./existing-reports gh-pages || true

          if [ -d "./existing-reports/reports" ]; then
            cp -r -- ./existing-reports/reports/* ./public/reports/ || true
          fi

          cd ./public/reports
          REPORT_LIST=""
          for d in $(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]+$' | sort -nr); do
            REPORT_LIST="${REPORT_LIST}<li><a href='./reports/${d}/'>Report Run #${d}</a></li>"
          done
          cd ../..

          cat << 'EOF' > ./public/index.html
          <!DOCTYPE html>
          <html lang="it">
          <head>
            <meta charset="UTF-8">
            <title>Storico Test UI IDPay</title>
          </head>
          <body>
            <h1>Storico Test UI IDPay</h1>
            <ul>
              __REPORT_LIST__
            </ul>
          </body>
          </html>
          EOF

          sed -i "s|__REPORT_LIST__|${REPORT_LIST}|g" ./public/index.html

      - name: Upload Playwright report to GitHub Pages
        if: always() && steps.check_report.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1
        with:
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true

