name: test-run-bdd

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      target_env:
        type: string
        required: true
        description: 'Target environment (dev or uat)'
      feature_tag:
        type: string
        required: true
        description: 'Behave tag to run'

jobs:
  run-bdd-feature-tests:
    runs-on: [ self-hosted-job, "${{ inputs.target_env }}" ]
    environment: ${{ inputs.target_env }}
    env:
      PARI_TARGET_ENV: ${{ inputs.target_env }}
      FEATURE_TAG: ${{ inputs.feature_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Azure Login
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a #v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        run: |
          echo "🔐 Fetching secret from Key Vault..."

          mkdir -p $GITHUB_WORKSPACE/secrets

          az keyvault secret show \
            --name "${{ secrets.SECRET_NAME }}" \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --query 'value' -o json | jq -r '.' > $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Failed to fetch secret from Key Vault"
            exit 1
          fi

          if [ ! -s $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json ]; then
            echo "::error::Secret file is empty"
            exit 1
          fi

          echo "📦 Validating JSON..."

          if ! jq empty $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json 2>/dev/null; then
            echo "::error::Invalid JSON format in secrets file"
            echo "File size: $(wc -c < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json) bytes"
            echo "Line count: $(wc -l < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json)"
            exit 1
          fi

          echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"

          echo "✅ Secret ready"

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 #v5.2.0
        with:
          python-version: 3.14.6

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          python3 -m pipenv sync
          python3 -m pipenv install allure-behave

      - name: Display Python and Pip versions
        run: |
          python3 --version
          pip3 --version
          pipenv --version
          pipenv run pip show allure-behave

      - name: Run tests with Behave
        run: |
          echo "Running env=$PARI_TARGET_ENV tag=$FEATURE_TAG"
          if [ "$FEATURE_TAG" = "all" ]; then
            python3 -m pipenv run behave --junit --junit-directory "tests/reports/behave" --format allure_behave.formatter:AllureFormatter -o allure-results
          else
            python3 -m pipenv run behave --junit --junit-directory "tests/reports/behave" --tags "$FEATURE_TAG" --format allure_behave.formatter:AllureFormatter -o allure-results
          fi
        continue-on-error: true

      - name: Sanitize allure results
        if: always()
        run: |
          if [ -d allure-results ]; then
            python3 util/sanitize-allure-results.py allure-results
          else
            echo "No allure-results directory to sanitize"
          fi

      - name: Save BDD test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-results-bdd
          path: allure-results

  publish-bdd-report:
    needs: run-bdd-feature-tests
    if: ${{ always() && inputs.target_env == 'uat' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Download BDD test results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          name: allure-results-bdd
          path: allure-results
      
      - name: Add Allure executor metadata
        if: always()
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "BDD Report #${{ github.run_number }}",
            "reportUrl": "https://pagopa.github.io/${{ github.event.repository.name }}/bdd"
          }
          EOF

      - name: Load test report history
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Install Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline --no-fund --no-audit

      - name: Build BDD test report
        if: always()
        run: |
          if [ -d gh-pages/bdd/last-history ]; then
            mkdir -p allure-results/history
            cp -R gh-pages/bdd/last-history/. allure-results/history/
          fi

          allure generate allure-results --clean -o allure-report-bdd

          mkdir -p allure-report-bdd/last-history
          if [ -d allure-report-bdd/history ]; then
            cp -R allure-report-bdd/history/. allure-report-bdd/last-history/
          fi

      - name: Sanitize BDD report
        if: always()
        run: |
          python3 util/sanitize-allure-results.py allure-report-bdd

      - name: Publish BDD test report
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e #v4.0.0
        if: always()
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: allure-report-bdd
          destination_dir: bdd
          keep_files: true