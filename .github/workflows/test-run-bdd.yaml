name: test-run-bdd

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      target_env:
        type: string
        required: true
        description: 'Target environment (dev or uat)'
      feature_tag:
        type: string
        required: true
        description: 'Behave tag to run'
      reward_batch_cleanup:
        type: boolean
        required: true
        description: 'Cleanup environment after test run'

jobs:
  run-bdd-feature-tests:
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 90
    runs-on: [ self-hosted-job, "${{ inputs.target_env }}" ]
    environment: ${{ inputs.target_env }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ inputs.feature_tag == 'all' && fromJson('["bonus_elettrodomestici", "bonus_decoder", "common_without_bonus_tag"]') || fromJson(format('["{0}"]', inputs.feature_tag)) }}

    env:
      PARI_TARGET_ENV: ${{ inputs.target_env }}
      TEST_SELECTION: ${{ matrix.tag }}
      FEATURE_TAG: ${{ matrix.tag == 'common_without_bonus_tag' && 'bonus_elettrodomestici' || matrix.tag }}
      PARI_REWARD_BATCH_CLEANUP: ${{ inputs.reward_batch_cleanup }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Azure Login
        uses: azure/login@6c251865b4e6290e7b78be643ea2d005bc51f69a #v2.1.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        run: |
          echo "🔐 Fetching secret from Key Vault..."

          mkdir -p $GITHUB_WORKSPACE/secrets

          az keyvault secret show \
            --name "${{ secrets.SECRET_NAME }}" \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --query 'value' -o json | jq -r '.' > $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Failed to fetch secret from Key Vault"
            exit 1
          fi

          if [ ! -s $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json ]; then
            echo "::error::Secret file is empty"
            exit 1
          fi

          echo "📦 Validating JSON..."

          if ! jq empty $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json 2>/dev/null; then
            echo "::error::Invalid JSON format in secrets file"
            echo "File size: $(wc -c < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json) bytes"
            echo "Line count: $(wc -l < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json)"
            exit 1
          fi

          echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"

          echo "✅ Secret ready"

      - name: Setup Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 #v5.2.0
        with:
          python-version: 3.14.6

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          python3 -m pipenv sync
          python3 -m pipenv run python -m pip install allure-behave==2.16.2

      - name: Display Python and Pip versions
        run: |
          python3 --version
          pip3 --version
          pipenv --version
          pipenv run pip show allure-behave

      - name: Run tests with Behave
        run: |
          echo "Running env=$PARI_TARGET_ENV selection=$TEST_SELECTION"
          selection="$TEST_SELECTION"
          if [ "$selection" = "common_without_bonus_tag" ]; then
            selection="not (bonus_elettrodomestici or bonus_decoder)"
          fi
          python3 -m pipenv run behave --no-capture-hooks \
            bdd/features/common_bonus_features \
            bdd/features/bonus_elettrodomestici \
            bdd/features/bonus_decoder \
            --tags "$selection" \
            --junit --junit-directory "tests/reports/behave" \
            --format pretty -o /dev/stdout \
            --format allure_behave.formatter:AllureFormatter -o allure-results

      - name: Sanitize allure results
        if: always()
        run: |
          if [ -d allure-results ]; then
            if [ "$TEST_SELECTION" = "common_without_bonus_tag" ] || [ "$TEST_SELECTION" = "bonus_elettrodomestici" ] || [ "$TEST_SELECTION" = "bonus_decoder" ]; then
              python3 util/sanitize-allure-results.py allure-results --initiative "$TEST_SELECTION"
            else
              python3 util/sanitize-allure-results.py allure-results
            fi
            python3 util/check_allure_results.py allure-results --junit tests/reports/behave --selection "$TEST_SELECTION"
          else
            echo "No allure-results directory to sanitize"
          fi

      - name: Save BDD test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: allure-results-${{ matrix.tag }}
          path: allure-results
          if-no-files-found: ignore

  publish-bdd-report:
    concurrency:
      group: bdd-report-publication
      cancel-in-progress: false
    needs: run-bdd-feature-tests
    if: ${{ always() && inputs.target_env == 'uat' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      REPORT_SELECTION: ${{ inputs.feature_tag }}
      REPORT_PATH: bdd
    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0

      - name: Download all BDD test results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 #v4.1.8
        with:
          pattern: allure-results-*
          path: merged-allure-results
          merge-multiple: true

      - name: Verify downloaded selections
        run: |
          if [ "$REPORT_SELECTION" = "all" ]; then
            python3 util/check_allure_results.py merged-allure-results --selections bonus_elettrodomestici bonus_decoder common_without_bonus_tag
          else
            python3 util/check_allure_results.py merged-allure-results --selections "$REPORT_SELECTION"
          fi

      - name: Add Allure executor metadata
        run: |
          mkdir -p merged-allure-results
          printf '%s\n' "${TARGET_ENV^^}" > merged-allure-results/environment.properties
          cat > merged-allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "BDD Report #${{ github.run_number }} [$REPORT_SELECTION]",
            "reportUrl": "https://pagopa.github.io/${{ github.event.repository.name }}/${REPORT_PATH}"
          }
          EOF

      - name: Load test report history
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 #v4.2.0
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline@2.38.0 --no-fund --no-audit

      - name: Build BDD test report
        run: |
          if [ -d "gh-pages/$REPORT_PATH/last-history" ]; then
            mkdir -p merged-allure-results/history
            cp -R "gh-pages/$REPORT_PATH/last-history/." merged-allure-results/history/
          fi

          allure generate merged-allure-results --clean -o allure-report-bdd

          mkdir -p allure-report-bdd/last-history
          if [ -d allure-report-bdd/history ]; then
            cp -R allure-report-bdd/history/. allure-report-bdd/last-history/
          fi

      - name: Verify generated report
        run: |
          if [ "$REPORT_SELECTION" = "all" ]; then
            python3 util/check_allure_results.py merged-allure-results --selections bonus_elettrodomestici bonus_decoder common_without_bonus_tag --report allure-report-bdd
          else
            python3 util/check_allure_results.py merged-allure-results --selections "$REPORT_SELECTION" --report allure-report-bdd
          fi

      - name: Sanitize BDD report
        run: |
          python3 util/sanitize-allure-results.py allure-report-bdd

      - name: Publish BDD test report
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e #v4.0.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: allure-report-bdd
          destination_dir: ${{ env.REPORT_PATH }}
          keep_files: true
