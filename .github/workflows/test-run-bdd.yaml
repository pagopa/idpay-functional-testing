name: test-run-bdd

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      target_env:
        type: string
        required: true
        description: 'Target environment (dev or uat)'
      feature_tag:
        type: string
        required: true
        description: 'Behave tag to filter'
      initiative:
        type: string
        required: true
        description: 'Initiative name to run, or all'
      reward_batch_cleanup:
        type: boolean
        required: true
        description: 'Cleanup environment after test run'

jobs:
  select-initiatives:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    outputs:
      initiatives: ${{ steps.matrix.outputs.initiatives }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Select initiative matrix
        id: matrix
        env:
          SELECTED_INITIATIVE: ${{ inputs.initiative }}
        run: |
          initiatives=$(python3 -m conf.initiative_config matrix "$SELECTED_INITIATIVE")
          echo "initiatives=$initiatives" >> "$GITHUB_OUTPUT"

  run-bdd-feature-tests:
    needs: select-initiatives
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 90
    runs-on: [ self-hosted-job, "${{ inputs.target_env }}" ]
    environment: ${{ inputs.target_env }}

    strategy:
      fail-fast: false
      matrix:
        initiative: ${{ fromJson(needs.select-initiatives.outputs.initiatives) }}

    env:
      PARI_TARGET_ENV: ${{ inputs.target_env }}
      FEATURE_TAG: ${{ inputs.feature_tag == 'all' && matrix.initiative || inputs.feature_tag }}
      PARI_FEATURE_INITIATIVE: ${{ matrix.initiative }}
      PARI_REWARD_BATCH_CLEANUP: ${{ inputs.reward_batch_cleanup }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve Key Vault secret as JSON file
        run: |
          echo "🔐 Fetching secret from Key Vault..."

          mkdir -p $GITHUB_WORKSPACE/secrets

          az keyvault secret show \
            --name "${{ secrets.SECRET_NAME }}" \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --query 'value' -o json | jq -r '.' > $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Failed to fetch secret from Key Vault"
            exit 1
          fi

          if [ ! -s $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json ]; then
            echo "::error::Secret file is empty"
            exit 1
          fi

          echo "📦 Validating JSON..."

          if ! jq empty $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json 2>/dev/null; then
            echo "::error::Invalid JSON format in secrets file"
            echo "File size: $(wc -c < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json) bytes"
            echo "Line count: $(wc -l < $GITHUB_WORKSPACE/secrets/pari-feature-secrets.json)"
            exit 1
          fi

          echo "PARI_SECRET_PATH=$GITHUB_WORKSPACE/secrets/pari-feature-secrets.json" >> "$GITHUB_ENV"

          echo "✅ Secret ready"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: 3.14.6
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          python3 -m pipenv sync --dev

      - name: Display Python and Pip versions
        run: |
          python3 --version
          pip3 --version
          pipenv --version
          pipenv run pip show allure-behave

      - name: Run tests with Behave
        run: |
          echo "Running env=$PARI_TARGET_ENV initiative=$PARI_FEATURE_INITIATIVE tag=$FEATURE_TAG" reward_batch_cleanup=$PARI_REWARD_BATCH_CLEANUP
          INITIATIVE_FILTER=$(python3 -m conf.initiative_config filter "$PARI_FEATURE_INITIATIVE")
          if [ "$FEATURE_TAG" = "all" ]; then
            python3 -m pipenv run behave --no-capture-hooks\
            --tags "$INITIATIVE_FILTER" \
            --tags "not @ignore" \
            --junit \
            --junit-directory "tests/reports/behave" \
            --format pretty \
            -o /dev/stdout \
            --format allure_behave.formatter:AllureFormatter \
            -o allure-results
          else
            python3 -m pipenv run behave --no-capture-hooks\
            --tags "$FEATURE_TAG" \
            --tags "$INITIATIVE_FILTER" \
            --tags "not @ignore" \
            --junit \
            --junit-directory "tests/reports/behave" \
            --format pretty \
            -o /dev/stdout \
            --format allure_behave.formatter:AllureFormatter \
            -o allure-results
          fi

      - name: Sanitize allure results
        if: always()
        run: |
          if [ -d allure-results ]; then
            python3 util/sanitize-allure-results.py allure-results --initiative "$PARI_FEATURE_INITIATIVE"
          else
            echo "No allure-results directory to sanitize"
          fi

      - name: Save BDD test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results-${{ matrix.initiative }}
          path: allure-results
          if-no-files-found: ignore

      - name: Notify failure to Slack
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: |-
                    *${{ github.event.repository.name }} — functional tests failed*
                    • *Initiative:* `${{ matrix.initiative }}`
                    • *Environment:* `${{ inputs.target_env }}`
                    • <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run #${{ github.run_number }}>

  publish-bdd-report:
    needs: run-bdd-feature-tests
    if: ${{ always() && inputs.target_env == 'uat' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      TARGET_ENV: ${{ inputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Download all BDD test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          pattern: allure-results-*
          path: merged-allure-results
          merge-multiple: true

      - name: Add Allure executor metadata
        if: always()
        run: |
          mkdir -p merged-allure-results
          printf '%s\n' "${TARGET_ENV^^}" > merged-allure-results/environment.properties
          cat > merged-allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "BDD Report #${{ github.run_number }}",
            "reportUrl": "https://pagopa.github.io/${{ github.event.repository.name }}/bdd/${{ github.run_number }}/"
          }
          EOF

      - name: Load test report history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: java --version

      - name: Install Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline --no-fund --no-audit

      - name: Build BDD test report
        if: always()
        run: |
          if [ -d gh-pages/bdd/last-history ]; then
            mkdir -p merged-allure-results/history
            cp -R gh-pages/bdd/last-history/. merged-allure-results/history/
          fi

          allure generate merged-allure-results --clean -o allure-report-bdd

          mkdir -p allure-report-bdd/last-history
          if [ -d allure-report-bdd/history ]; then
            cp -R allure-report-bdd/history/. allure-report-bdd/last-history/
          fi

      - name: Sanitize BDD report
        if: always()
        run: |
          python3 util/sanitize-allure-results.py allure-report-bdd

      - name: Prepare latest and per-run BDD reports
        run: |
          mkdir -p "bdd-publish/$GITHUB_RUN_NUMBER"
          cp -R allure-report-bdd/. bdd-publish/
          cp -R allure-report-bdd/. "bdd-publish/$GITHUB_RUN_NUMBER/"

      - name: Publish BDD test report
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e #v4.0.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: bdd-publish
          destination_dir: bdd
          keep_files: true
