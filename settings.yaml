SECRET_PATH: "conf/pari-feature-secrets.json"
# Default environment. Overridden if specified through environment variable (prefixed by conf.IDPAY_ENV_VAR_PREFIX current value)
TARGET_ENV: "uat"
RDB_EMAIL_TEST_RECIPIENT: "rdb-functional-test@example.com"
RDB_EMAIL_PORTAL_URLS:
  dev: "https://rdb.dev.cstar.pagopa.it/registro-dei-beni"
  uat: "https://rdb.uat.cstar.pagopa.it/registro-dei-beni"
API_KEY_HEADER: "Ocp-Apim-Subscription-Key"
default_timeout: 5000
long_timeout: 60000
iso_date_format: '%Y-%m-%dT%H:%M:%S.000%z'
KEEP_INITIATIVES_AFTER_TEST: false
KEEP_INITIATIVES_AFTER_FAILED_TEST: false
REWARD_BATCH_CLEANUP: true
INITIATIVE_STARTUP_TIME_SECONDS: 120
IDPAY:
  domain: "/idpay-itn"
  merchant_test_token_issuer: "https://api-io.dev.cstar.pagopa.it"
  endpoints:
    ecommerce:
      path: "/merchant-ecommerce"
      merchant_portal: "/merchant/portal"
      barcode: "/transactions/bar-code"
      authorize: "/authorize"
      capture: "/capture"
      invoice: "/invoice"
      reversal: "/reversal"
    onboarding:
      path: "/onboarding"
      status: '/status'
    wallet:
      path: '/wallet'
      unsubscribe: '/unsubscribe'
      statuses:
        not_refundable: 'NOT_REFUNDABLE'
        not_refundable_only_instrument: 'NOT_REFUNDABLE_ONLY_INSTRUMENT'
        not_refundable_only_iban: 'NOT_REFUNDABLE_ONLY_IBAN'
        refundable: 'REFUNDABLE'
        unsubscribed: 'UNSUBSCRIBED'
        suspended: 'SUSPENDED'
        readmitted: 'READMITTED'
    timeline:
      path: '/timeline'
      operations:
        onboarding: 'ONBOARDING'
        add_iban: 'ADD_IBAN'
        add_instrument: 'ADD_INSTRUMENT'
        delete_instrument: 'DELETE_INSTRUMENT'
        transaction: 'TRANSACTION'
        reversal: 'REVERSAL'
        suspended: 'SUSPENDED'
        readmitted: 'READMITTED'
        unsubscribed: 'UNSUBSCRIBED'
        rejected_add_instrument: 'REJECTED_ADD_INSTRUMENT'
        rejected_delete_instrument: 'REJECTED_DELETE_INSTRUMENT'
    statistics:
      path: '/idpayinitiativestatistics/idpay'
    payment:
      path: '/payment'
      internal_path: '/idpaypayment/idpay'
      bar_code:
        path: '/bar-code'
    transactions:
      path: '/idpaytransactions'
      merchant: '/merchant'
      portal: '/portal/initiatives'
      processed: '/transactions/processed'
      reward_batch_eligibility: '/reward-batch/eligibility'
      reward_batch:
        path: '/reward-batches'
        approved: '/approved'
        validated: '/validated'
        transactions:
          approved: '/transactions/approved'
          rejected: '/transactions/rejected'
          suspended: '/transactions/suspended'
          postpone: '/transactions/{transaction_id}/postpone'
      reward_batches: '/idpay/merchant/portal/initiatives'
      reward_batch_test_support: '/idpay/internal/test-support/initiatives'
    merchant:
      path: '/merchant'
      internal_path: '/idpaymerchant/idpay'
    mock:
      internal_path: '/idpaymock/idpay'
      isee: '/mock/isee'
      family: '/mock/family'
      pdnd: '/mock/pdnd'
    initiatives:
      portal: '/idpayportalwelfarebackendinitiative'
    mcshared_data_vault:
      internal_path: '/mcshareddatavault/tokens'
      detokenize: '/pii'
    asset_register:
      internal_path: "/register"
      backend_path: "/idpayassetregisterbackend/idpay/register"
      token_test: "/token/test"
      initiatives: "/initiatives"
      producers: "/producers"
      email: "/email"
      notify_path: "/email-notification/notify"
      products:
        path: "/products"
        update_status:
          approved: "/products/update-status/approved"
          wait_approved: "/products/update-status/wait-approved"
          supervised: "/products/update-status/supervised"
          rejected: "/products/update-status/rejected"
          restored: "/products/update-status/restored"
      product_files:
        path: "/product-files"
        verify: "/product-files/verify"
        report: "/product-files/{}/report"
        batch_list: "/product-files/batch-list"
      institutions:
        by_id: "/institutions/{}"
      clean:
        products: "/clean/products"
        products_file: "/clean/products-file"
        products_file_report: "/clean/products-file/report"
        products_file_formal: "/clean/products-file/formal"
      authorization:
        path: "/permissions"
      consent:
        path: "/consent"
  acquirer_id: 'PAGOPA'
SHARED:
  domain: "/shared"
  endpoints:
    mock_io:
      login: "/mock-io/login"
